<main class="page publication-page">
<div class="container">
  <div class="page-head publication-head">
    <h1>Articles & Presentations</h1>
  </div>

  <section class="publication-explorer" aria-label="Filter scholarly output">
    <span id="publicationCount" class="sr-only" aria-live="polite">Loading…</span>
    <div class="publication-filters" id="publicationFilters">
      <label class="publication-filter">
        <input type="checkbox" value="Articles" checked>
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Articles</span>
      </label>
      <label class="publication-filter">
        <input type="checkbox" value="Submitted" checked>
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Submitted</span>
      </label>
      <label class="publication-filter">
        <input type="checkbox" value="Presentation">
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Presentation</span>
      </label>
      <label class="publication-filter">
        <input type="checkbox" value="Poster">
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Poster</span>
      </label>
      <label class="publication-filter">
        <input type="checkbox" value="Reports/Chapter">
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Reports / Chapter</span>
      </label>
      <label class="publication-filter">
        <input type="checkbox" value="Seminar/Invited talk">
        <span class="filter-mark" aria-hidden="true"></span>
        <span>Seminar / Invited talk</span>
      </label>
    </div>

    <div class="filter-actions">
      <button type="button" id="selectAllPublications">Select all</button>
      <span aria-hidden="true">·</span>
      <button type="button" id="clearPublications">Clear</button>
    </div>

  </section>

  <section class="publication-results-shell" aria-label="Filtered scholarly output">
    <div id="publicationResults" class="publication-results" aria-live="polite" aria-busy="true">
      <div class="publication-loading">
        <span class="loading-line"></span>
        <span>Loading publication record…</span>
      </div>
    </div>
  </section>

  <p class="more publication-scholar"><a href="https://scholar.google.com/citations?user=gcfdVeAAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">Google Scholar →</a></p>
</div>
